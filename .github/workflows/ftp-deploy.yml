name: Deploy to FTP (Gigaserver)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.greengarden.al
          username: greengarden_al
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /greengarden.al/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/zaloha/**
            **/mail-backend.zip
            **/config.php
            **/config.example.php
            **/README.txt
